# Dev profile: a small copy of the live data on its own port, for agents and local checks.
# Start it with music-stats-dev.bat (or ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev).
# Rebuild the dev DB with tools/devdb/build-dev-db.bat. Never point this profile at the live DB.
spring.datasource.url=jdbc:sqlite:C:/Music Stats DB/music-stats-dev.db?busy_timeout=10000&journal_mode=WAL&cache_size=-16384&temp_store=MEMORY
server.port=8081

# No automated Last.fm imports in dev (the dev DB's app_config also has automation.enabled=false).
musicstats.play-import.automation.enabled=false
musicstats.play-import.automation.api-key=

# Saved filters go to their own file so dev changes never touch the live one.
musicstats.saved-filters.file=C:/Music Stats DB/music-stats-dev-saved-filters.properties
