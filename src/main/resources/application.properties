# SQLite DB Properties
# busy_timeout: wait up to 10s for locks to clear (prevents immediate "database locked" errors)
# journal_mode=WAL: enables concurrent reads during writes for better performance
# cache_size=-65536: 64 MB page cache per pooled connection (SQLite's default is 2 MB)
# temp_store=MEMORY: GROUP BY / ORDER BY / DISTINCT temp b-trees stay in memory instead of temp files
# mmap_size: memory-map the database file (16 GB cap, larger than the ~9.5 GB file). Pages are read
#   straight from the OS file cache, which matters most when rows carry image BLOB overflow chains.
spring.datasource.url=jdbc:sqlite:C:/Music Stats DB/music-stats.db?busy_timeout=10000&journal_mode=WAL&cache_size=-65536&temp_store=MEMORY&mmap_size=17179869184
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# HikariCP connection pool - allow more connections for read concurrency with WAL mode
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Use exact table/column names as specified in annotations (don't convert to snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable Spring SQL initialization (avoid running schema.sql/data.sql)
spring.sql.init.mode=never

# JDBC template tuning
spring.jdbc.template.fetch-size=1000
spring.jdbc.template.max-rows=-1

# SQLite specific - disable batch updates for better compatibility
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false

# Thymeleaf dev settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Enable AntPathMatcher for trailing-slash behavior
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# File upload (multipart) limits - increase so large CSV imports don't fail
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Automated Last.fm import configuration
musicstats.play-import.automation.enabled=true
musicstats.play-import.automation.account=vatito
musicstats.play-import.automation.api-key=e01f90c03b0b1ec2273cd5d46e5628f6
musicstats.play-import.automation.interval-seconds=600

# Opt the app's process out of Windows power throttling (EcoQoS). Without a visible window,
# Windows may otherwise run requests on efficiency cores at reduced clocks (~2x slower pages).
musicstats.performance.high-qos=true

# Prevent Logback classes from being unloaded during maven JVM exit
logging.register-shutdown-hook=false

# Static files: each URL carries a hash of the file's content (Thymeleaf @{...} links are rewritten), so a
# deploy that changes a file changes its URL, and browsers revalidate before reusing a cached copy. Without
# this, Safari kept serving old CSS/JS for days after deploys (no Cache-Control, heuristic caching).
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.no-cache=true
