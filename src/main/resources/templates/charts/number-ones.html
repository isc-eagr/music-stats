<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' - Music Stats'}">Weekly Number Ones - Music Stats</title>
    <link rel="stylesheet" th:href="@{/css/global.css(v=3)}">
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/catalog-list.css}">
    <link rel="stylesheet" th:href="@{/css/chart-overview.css}">
    <link rel="stylesheet" th:href="@{/css/number-ones.css(v=1)}">
    <script th:src="@{/js/number-ones.js(v=1)}" defer></script>
</head>
<body>
    <th:block th:replace="~{fragments/navigation :: navigation}"></th:block>
    <div class="container co-page n1-page" id="numberOnes"
         th:attr="data-unit=${chart.unit()}">
        <div class="toolbar catalog-toolbar">
            <div class="catalog-toolbar-header">
                <div class="catalog-toolbar-heading">
                    <h1 class="catalog-toolbar-title" th:text="${pageTitle}">Weekly Number Ones</h1>
                </div>
                <div class="catalog-toolbar-actions">
                    <a class="toolbar-btn" th:href="@{/charts/overview(chart=${chart.key()})}">Overview</a>
                    <a th:if="${chart.key() == 'weekly'}" class="toolbar-btn" href="/charts/weekly">Weekly chart</a>
                </div>
            </div>

            <nav class="co-menubar" aria-label="Number ones charts">
                <a th:each="item : ${charts}"
                   class="co-menu-tab" th:classappend="${'co-tone-' + item.key() + (item == chart ? ' active' : '')}"
                   th:href="@{'/charts/' + ${item.key()} + '/number-ones'}"
                   th:attr="aria-current=${item == chart ? 'page' : null}">
                    <span class="co-dot"></span><span th:text="${item.label()}">Weekly</span>
                </a>
                <div class="co-menu-side" th:if="${chart.key() == 'weekly'}">
                    <span class="co-menu-label">Show</span>
                    <a class="co-menu-tab" th:href="@{/charts/weekly/number-ones(type='song')}" th:classappend="${selectedType == 'song'} ? 'active' : ''">Songs</a>
                    <a class="co-menu-tab" th:href="@{/charts/weekly/number-ones(type='album')}" th:classappend="${selectedType == 'album'} ? 'active' : ''">Albums</a>
                </div>
            </nav>
        </div>

        <th:block th:if="${not #lists.isEmpty(runs)}">
            <div class="n1-filters">
                <div class="n1-filter-side">
                    <label class="n1-field">Year
                        <select id="n1Year"><option value="">All years</option></select>
                    </label>
                    <label class="n1-field n1-search">
                        <span class="n1-sr">Search</span>
                        <input type="search" id="n1Search" placeholder="Search title or artist" autocomplete="off">
                    </label>
                </div>
            </div>

            <div class="table-scroll n1-table-wrap">
                <table class="sticky-head n1-table">
                    <thead>
                        <tr>
                            <th class="n1-col-cover"><span class="n1-sr">Cover</span></th>
                            <th><button type="button" data-sort="title">Title</button></th>
                            <th><button type="button" data-sort="artist">Artist</button></th>
                            <th><button type="button" data-sort="length" th:text="${chart.unit() == 'day' ? 'Days' : 'Weeks'}">Weeks</button></th>
                            <th><button type="button" data-sort="start">Start</button></th>
                            <th><button type="button" data-sort="end">End</button></th>
                            <th class="n1-num"><button type="button" data-sort="run">Run</button></th>
                            <th class="n1-num"><button type="button" data-sort="cumulative">Cumul.</button></th>
                            <th class="n1-num"><button type="button" data-sort="total">Total</button></th>
                        </tr>
                    </thead>
                    <tbody id="n1Rows">
                        <tr th:each="run : ${runs}" class="n1-row"
                            th:classappend="${run.display().gender() != null} ? ${'n1-' + run.display().gender()} : ''"
                            th:attr="data-gender=${run.display().gender()},data-year=${run.year()},data-start=${run.startDate()},data-end=${run.endDate()},data-length=${run.length()},data-run=${run.runNumber()},data-cumulative=${run.cumulative()},data-total=${run.total()},data-title=${run.display().title()},data-artist=${run.display().artistName()}">
                            <td class="n1-col-cover">
                                <img th:if="${run.display().coverUrl() != null}" th:src="${run.display().coverUrl()}" alt="" class="n1-cover" loading="lazy"
                                     onerror="this.replaceWith(Object.assign(document.createElement('span'), {className: 'n1-cover n1-cover-empty'}))">
                                <span th:unless="${run.display().coverUrl() != null}" class="n1-cover n1-cover-empty"></span>
                            </td>
                            <td class="n1-title">
                                <a th:if="${run.display().link() != null}" th:href="${run.display().link()}" th:text="${run.display().title()}">Title</a>
                                <span th:unless="${run.display().link() != null}" th:text="${run.display().title()}">Title</span>
                            </td>
                            <td class="n1-artist">
                                <span class="n1-dot" aria-hidden="true"></span>
                                <a th:if="${run.display().artistId() != null}" th:href="@{'/artists/' + ${run.display().artistId()}}" th:text="${run.display().artistName()}">Artist</a>
                                <span th:unless="${run.display().artistId() != null}" th:text="${run.display().artistName()}">Artist</span>
                            </td>
                            <td><div class="n1-length"><span class="n1-length-value" th:text="${run.length()}">1</span><span class="n1-ticks" aria-hidden="true"></span></div></td>
                            <td class="n1-date" th:text="${run.startDisplay()}">01/01/2024</td>
                            <td class="n1-date n1-date-end" th:text="${run.endDisplay()}">07/01/2024</td>
                            <td class="n1-num" th:text="${run.runNumber()}">1</td>
                            <td class="n1-num n1-cumulative" th:text="${run.cumulative()}">1</td>
                            <td class="n1-num n1-total" th:text="${run.total()}">1</td>
                        </tr>
                    </tbody>
                </table>
                <div class="n1-empty-filter" id="n1NoMatch" hidden>No runs match these filters.</div>
            </div>
            <div class="n1-foot" id="n1Count"></div>
        </th:block>

        <div class="n1-empty" th:if="${#lists.isEmpty(runs)}">No #1 chart data available yet.</div>
    </div>
</body>
</html>
