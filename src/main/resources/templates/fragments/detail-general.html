<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared pieces of the detail pages General tab: artist, album, song (styles in css/detail-general.css) -->

<!-- One attribute row in the sidebar profile: label, value and #rank, linking to the filtered catalog table.
     noun   names what is ranked in the hover text ("#2 among Pop albums"): artists, albums or songs.
     source says where an inheritable value comes from: null (nothing shown), 'override' (amber Override badge)
            or any other text, shown as "from <text>".
     An empty value renders a plain "Not set" row instead of a link.
     A ranked row carries data-rank-attr (derived from the label) so detail-sidebar.js can show the items ranked
     around this one on hover. -->
<th:block th:fragment="rank-row(label, value, rank, href, flagCode, showDot, noun, source)">
    <a th:if="${value != null and !#strings.isEmpty(value)}" class="dt-row" th:href="${href}" target="_blank"
       th:title="${rank != null ? label + ': #' + rank + ' among ' + value + ' ' + noun : label}"
       th:with="rankAttr=${label == 'Spanish Rap' ? 'spanishRap' : (label == 'Released in' or label == 'Release year' ? 'releaseYear' : #strings.toLowerCase(label))}"
       th:attr="data-rank-attr=${rank != null ? rankAttr : null},data-rank-value=${rank != null ? value : null},data-rank-noun=${rank != null ? noun : null}">
        <span class="dt-row-k"><th:block th:text="${label}">Genre</th:block><span th:if="${source == 'override'}" class="dt-ovr">Override</span><small th:if="${source != null and source != 'override'}" class="dt-from" th:text="'from ' + ${source}">from Artist</small></span>
        <span class="dt-row-v">
            <span th:if="${showDot}" class="dt-dot" aria-hidden="true"></span>
            <img th:if="${flagCode != null}" th:src="@{https://flagcdn.com/w40/{code}.png(code=${flagCode})}" th:alt="${value}" />
            <span th:text="${value}">Value</span>
            <span th:if="${rank != null}" class="dt-rank" th:classappend="${rank == 1} ? 'is-gold' : ''" th:text="'#' + ${rank}">#1</span>
            <svg class="dt-ico dt-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </span>
    </a>
    <div th:unless="${value != null and !#strings.isEmpty(value)}" class="dt-row">
        <span class="dt-row-k"><th:block th:text="${label}">Genre</th:block><span th:if="${source == 'override'}" class="dt-ovr">Override</span><small th:if="${source != null and source != 'override'}" class="dt-from" th:text="'from ' + ${source}">from Artist</small></span>
        <span class="dt-row-v is-empty">Not set</span>
    </div>
</th:block>

<!-- Header of the General box (dt-hero): each page puts its plays block on the left (total, primary / legacy split)
     with this overall standing badge next to the total, and hero-span on the right. -->

<!-- Overall standing badge: #rank among every artist / album / song by total plays.
     noun is the plural shown under it (artists, albums, songs); href opens that catalog's table.
     Hovering it shows the items ranked around this one (detail-sidebar.js rank neighbors). -->
<a th:fragment="standing(position, total, noun, href)" th:if="${position != null}"
   class="dt-standing" th:href="${href}" target="_blank"
   th:title="'Rank #' + ${position} + ' among all ' + ${noun} + ' by total plays'"
   data-rank-attr="overall" data-rank-value="Overall" th:attr="data-rank-noun=${noun}">
    <span class="dt-standing-n" th:text="'#' + ${position}">#1</span>
    <span class="dt-standing-tx">
        <span class="dt-standing-k">Overall</span>
        <span class="dt-standing-sub" th:text="'of ' + ${#numbers.formatInteger(total != null ? total : 0, 1, 'COMMA')} + ' ' + ${noun}">of 0 artists</span>
    </span>
</a>

<!-- Listening span as First play / Last play rows (no title: the rows speak for themselves).
     Dates cover every play, primary and legacy alike.
     firstRec / lastRec (DateFormatUtils.Recency) add how long ago each was, with the list Table view recency dot.
     firstSong / lastSong (anything with id and name) add the song behind each end; null leaves it out. -->
<div th:fragment="hero-span(first, firstRec, firstSong, last, lastRec, lastSong)" class="dt-hero-span">
        <dl class="dt-run-rows">
            <div><dt>First play</dt><dd><a th:if="${firstSong != null}" th:href="@{'/songs/' + ${firstSong.id}}" th:text="${firstSong.name}" th:title="${firstSong.name}">Song</a><th:block th:text="${first != null ? first : 'N/A'}">N/A</th:block><span th:if="${firstRec != null}" class="dt-ago"><span class="dt-rec-dot" th:classappend="${firstRec.level()}" aria-hidden="true"></span><th:block th:text="${firstRec.ago()}">1 year ago</th:block></span></dd></div>
            <div><dt>Last play</dt><dd><a th:if="${lastSong != null}" th:href="@{'/songs/' + ${lastSong.id}}" th:text="${lastSong.name}" th:title="${lastSong.name}">Song</a><th:block th:text="${last != null ? last : 'N/A'}">N/A</th:block><span th:if="${lastRec != null}" class="dt-ago"><span class="dt-rec-dot" th:classappend="${lastRec.level()}" aria-hidden="true"></span><th:block th:text="${lastRec.ago()}">1 year ago</th:block></span></dd></div>
        </dl>
</div>

<!-- Sort chips for the albums and songs sections; one sort at a time, clicking the active chip flips it -->
<div th:fragment="sort-chips" class="dt-sortbar" role="group" aria-label="Sort">
    <span class="dt-sortbar-l">Sort by</span>
    <button type="button" class="dt-sort-chip" data-sort-key="totalplays" data-sort-type="number">Total<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button th:if="${showLegacy != false}" type="button" class="dt-sort-chip" data-sort-key="primaryplays" data-sort-type="number">Primary<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button th:if="${showLegacy != false}" type="button" class="dt-sort-chip" data-sort-key="legacyplays" data-sort-type="number">Legacy<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button type="button" class="dt-sort-chip" data-sort-key="length" data-sort-type="number">Length<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button type="button" class="dt-sort-chip" data-sort-key="releasedate" data-sort-type="date">Released<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button type="button" class="dt-sort-chip" data-sort-key="firstlistened" data-sort-type="date">First listened<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button type="button" class="dt-sort-chip" data-sort-key="lastlistened" data-sort-type="date">Last listened<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button type="button" class="dt-sort-chip" data-sort-key="timelistened" data-sort-type="number">Listened<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <button type="button" class="dt-sort-chip" data-sort-key="name" data-sort-type="text">Name<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
</div>

<!-- Sortable column headers (same keys as the sort chips); the active one shows its direction -->
<th:block th:fragment="sort-headers(nameLabel)">
    <th class="dt-col-i"><span class="dt-th-btn">#</span></th>
    <th class="dt-col-name"><button type="button" class="dt-th-btn" data-sort-key="name" data-sort-type="text"><th:block th:text="${nameLabel}">Name</th:block><svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th class="is-num dt-col-total"><button type="button" class="dt-th-btn" data-sort-key="totalplays" data-sort-type="number">Total<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th th:if="${showLegacy != false}" class="is-num hide-mobile dt-col-num"><button type="button" class="dt-th-btn" data-sort-key="primaryplays" data-sort-type="number">Primary<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th th:if="${showLegacy != false}" class="is-num hide-mobile dt-col-num"><button type="button" class="dt-th-btn" data-sort-key="legacyplays" data-sort-type="number">Legacy<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th class="is-num hide-mobile dt-col-num"><button type="button" class="dt-th-btn" data-sort-key="length" data-sort-type="number">Length<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th class="hide-mobile dt-col-date"><button type="button" class="dt-th-btn" data-sort-key="releasedate" data-sort-type="date">Released<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th class="hide-mobile dt-col-date"><button type="button" class="dt-th-btn" data-sort-key="firstlistened" data-sort-type="date">First listened<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th class="hide-mobile dt-col-date"><button type="button" class="dt-th-btn" data-sort-key="lastlistened" data-sort-type="date">Last listened<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
    <th class="is-num hide-mobile dt-col-time"><button type="button" class="dt-th-btn" data-sort-key="timelistened" data-sort-type="number">Listened<svg class="dt-ico dt-sort-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
</th:block>

</body>
</html>
