<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="graphs-view" id="graphs-explorer" class="graphs-explorer">
    <header class="graphs-intro">
        <div><p class="graphs-eyebrow">Library explorer</p><h2>Your library, in perspective</h2></div>
        <a href="/playground?view=graphs" id="graphs-reset" class="graphs-button">Reset explorer</a>
    </header>

    <section class="graphs-filter-bar" aria-label="Catalog filters">
        <div class="graphs-filter-row">
            <label for="graphs-filter-source">Filter
                <select id="graphs-filter-source"><option value="artists" th:selected="${graphsSource == 'artists'}">Artists</option><option value="albums" th:selected="${graphsSource == 'albums'}">Albums</option><option value="songs" th:selected="${graphsSource == 'songs'}">Songs</option></select>
            </label>
            <button type="button" id="graphs-filter-toggle" class="graphs-button" aria-expanded="false" aria-controls="graphs-filter-editor">Edit filters</button>
            <details class="graphs-advanced">
                <summary class="graphs-button">Scope</summary>
                <div class="graphs-advanced-controls">
                    <label id="graphs-groups-control" hidden><input type="checkbox" id="graphs-include-groups"> Include group work for matched artists</label>
                    <label id="graphs-featured-control" hidden><input type="checkbox" id="graphs-include-featured"> Include featured work for matched artists</label>
                    <label for="graphs-item-limit">Ranked item limit <input type="number" id="graphs-item-limit" min="1" max="999" placeholder="All items"></label>
                    <label for="graphs-limit-entity">Play totals limited by
                        <select id="graphs-limit-entity"><option value="song">Top songs</option><option value="album">Top albums</option><option value="artist">Top artists</option></select>
                    </label>
                    <p class="graphs-muted">An item limit changes the data: each catalog is limited to its top items by plays before the breakdown is calculated.</p>
                </div>
            </details>
            <span id="graphs-filter-context" class="graphs-muted" aria-live="polite">Whole library</span>
        </div>
        <div id="graphs-filter-editor" hidden></div>
        <div id="graphs-active-filters" class="graphs-active-filters" aria-label="Active catalog filters"></div>
    </section>

    <div id="graphs-status" class="graphs-status" role="status" aria-live="polite">Loading your library breakdown...</div>
    <button type="button" id="graphs-retry" class="graphs-button" hidden>Try again</button>
    <div id="graphs-results" aria-busy="true" hidden>
        <nav id="graphs-summary" class="graphs-summary" aria-label="Measure shown in the table"></nav>

        <nav class="graphs-breakdowns" aria-label="Break down by">
            <button type="button" data-breakdown="general" aria-pressed="true" class="active">Overview</button>
            <button type="button" data-breakdown="country" aria-pressed="false">Country</button>
            <button type="button" data-breakdown="ethnicity" aria-pressed="false">Ethnicity</button>
            <button type="button" data-breakdown="genre" aria-pressed="false">Genre</button>
            <button type="button" data-breakdown="language" aria-pressed="false">Language</button>
            <button type="button" data-breakdown="listenYear" aria-pressed="false">Listen year</button>
            <button type="button" data-breakdown="releaseYear" aria-pressed="false">Release year</button>
            <button type="button" data-breakdown="subgenre" aria-pressed="false">Subgenre</button>
        </nav>

        <section class="graphs-data-panel" aria-labelledby="graphs-table-title">
            <div class="graphs-chart-heading">
                <h3 id="graphs-table-title">Plays by genre</h3>
                <div class="graphs-legend" aria-label="Gender colors"><span class="male">Male</span><span class="female">Female</span><span class="other">Other / unknown</span></div>
            </div>
            <div class="graphs-table-scroll" tabindex="0" aria-label="Breakdown data; scroll horizontally if needed"><table id="graphs-data-table"></table></div>
            <p id="graphs-table-note" class="graphs-muted"></p>
        </section>
    </div>
    <noscript><p>Enable JavaScript to filter and explore library graphs.</p></noscript>
</div>
</body>
</html>
