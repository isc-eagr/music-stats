<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Weekly chart table pieces (charts/weekly.html). One column set for every table on the page:
  run toggle, position (+ movement on phones), movement, cover, name + artist, plays, weeks, peak, weeks at peak.
  Plays, weeks and peak stay on the main row at every width; movement and weeks at peak move into the
  expanded run panel on phones. mode: 'chart' (this week's chart), 'falloff' or 'contender' (live preview 21-50).
-->
<body>

<thead th:fragment="head(kind, sortable)">
    <tr>
        <th class="wk-c-run" aria-label="Chart run"></th>
        <th class="wk-c-pos" th:attr="data-sort=${sortable ? 'number' : null}">#</th>
        <th class="wk-c-move wk-desk">Move</th>
        <th class="wk-c-cover" aria-label="Cover"></th>
        <th class="wk-c-name" th:attr="data-sort=${sortable ? 'text' : null}" th:text="${kind == 'album' ? 'Album' : 'Song'}">Song</th>
        <th class="wk-c-num" th:attr="data-sort=${sortable ? 'number' : null}">Plays</th>
        <th class="wk-c-num" th:attr="data-sort=${sortable ? 'number' : null}"><span class="wk-desk">Weeks</span><span class="wk-mob">Wks</span></th>
        <th class="wk-c-peak" th:attr="data-sort=${sortable ? 'number' : null}">Peak</th>
        <th class="wk-c-num wk-desk" th:attr="data-sort=${sortable ? 'number' : null}">Wks at peak</th>
    </tr>
</thead>

<th:block th:fragment="movement(entry, mode)">
    <span th:if="${mode == 'falloff'}" class="mvmt mvmt-down">OFF</span>
    <span th:if="${mode == 'chart' and entry.movementDisplay != '-'}" class="mvmt"
          th:classappend="${entry.movementClass}" th:text="${entry.movementDisplay}">NEW</span>
    <span th:if="${mode == 'contender' or (mode == 'chart' and entry.movementDisplay == '-')}" class="ct-dim">-</span>
</th:block>

<th:block th:fragment="stats(entry, mode)">
    <td class="wk-c-num" th:attr="data-sort-val=${entry.playCount != null ? entry.playCount : -1}">
        <span th:if="${entry.playBreakdownItems != null and !entry.playBreakdownItems.isEmpty()}"
              class="number-one-tooltip-trigger tooltip-enabled" tabindex="0" data-tooltip-title="Combined song versions:">
            <span class="wk-plays" th:text="${entry.playCount != null ? #numbers.formatInteger(entry.playCount, 1, 'COMMA') : '-'}">0</span>
            <span class="number-one-tooltip-item-source" hidden th:each="tooltipItem : ${entry.playBreakdownItems}" th:text="${tooltipItem}"></span>
        </span>
        <span th:unless="${entry.playBreakdownItems != null and !entry.playBreakdownItems.isEmpty()}" class="wk-plays"
              th:text="${entry.playCount != null ? #numbers.formatInteger(entry.playCount, 1, 'COMMA') : '-'}">0</span>
    </td>
    <td class="wk-c-num" th:attr="data-sort-val=${entry.weeksOnChart != null ? entry.weeksOnChart : -1}"
        th:text="${entry.weeksOnChart != null ? entry.weeksOnChart : '-'}">5</td>
    <td class="wk-c-peak" th:attr="data-sort-val=${entry.peakPosition != null ? entry.peakPosition : 9999}">
        <span th:if="${entry.peakPosition != null}" class="co-pk"
              th:classappend="${'co-band-' + (entry.peakPosition == 1 ? 1 : (entry.peakPosition <= 5 ? 2 : (entry.peakPosition <= 10 ? 3 : 4)))}"
              th:text="${'#' + entry.peakPosition}">#1</span>
        <span th:if="${entry.peakPosition == null}" class="ct-dim">-</span>
        <span th:if="${mode == 'chart' and entry.peakPosition != null and entry.position == entry.peakPosition}"
              class="wk-peak-now wk-desk" title="At its peak this week">Peak</span>
    </td>
    <td class="wk-c-num wk-desk" th:attr="data-sort-val=${entry.weeksAtPeak != null ? entry.weeksAtPeak : -1}"
        th:text="${entry.weeksAtPeak != null ? 'x' + entry.weeksAtPeak : '-'}">x1</td>
</th:block>

<th:block th:fragment="lead(entry, mode)">
    <td class="wk-c-run">
        <button th:if="${mode != 'contender'}" type="button" class="co-twisty wk-twisty" data-wk-run
                aria-expanded="false" aria-label="Show chart run">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
    </td>
    <td class="wk-c-pos rank-col" th:classappend="${mode == 'chart' and entry.position <= 3 ? 'ct-medal-' + entry.position : ''}"
        th:attr="data-sort-val=${entry.position}">
        <span class="wk-pos" th:text="${entry.position}">1</span>
        <span class="wk-mob wk-mv-mini" th:if="${mode != 'contender'}">
            <th:block th:replace="~{fragments/weekly-chart-rows :: movement(${entry}, ${mode})}"></th:block>
        </span>
    </td>
    <td class="wk-c-move wk-desk"><th:block th:replace="~{fragments/weekly-chart-rows :: movement(${entry}, ${mode})}"></th:block></td>
</th:block>

<tr th:fragment="songRow(entry, mode)" class="wk-row" data-entry="song"
    th:classappend="${entry.genderId == 2 ? 'ct-male' : (entry.genderId == 1 ? 'ct-female' : '')}"
    th:attr="data-song-id=${entry.songId},data-gender=${entry.genderId},data-album=${entry.albumName},data-weeks-at-peak=${entry.weeksAtPeak != null ? 'x' + entry.weeksAtPeak : '-'}">
    <th:block th:replace="~{fragments/weekly-chart-rows :: lead(${entry}, ${mode})}"></th:block>
    <td class="wk-c-cover">
        <a class="co-cover wk-cover" th:href="@{/songs/{id}(id=${entry.songId})}" tabindex="-1" aria-hidden="true">
            <img th:if="${entry.albumHasImage and entry.albumId != null}"
                 th:src="@{/albums/{id}/image(id=${entry.albumId}, thumbnail=true)}" alt="" loading="lazy">
            <img th:if="${!entry.albumHasImage and entry.hasImage}"
                 th:src="@{/songs/{id}/image(id=${entry.songId}, thumbnail=true)}" alt="" loading="lazy">
        </a>
    </td>
    <td class="wk-c-name" th:attr="data-sort-val=${entry.songName}">
        <a class="wk-name" th:href="@{/songs/{id}(id=${entry.songId})}" th:text="${entry.songName}">Song</a>
        <a class="wk-artist" th:href="@{/artists/{id}(id=${entry.artistId})}" th:text="${entry.artistName}">Artist</a>
    </td>
    <th:block th:replace="~{fragments/weekly-chart-rows :: stats(${entry}, ${mode})}"></th:block>
</tr>

<tr th:fragment="albumRow(entry, mode)" class="wk-row" data-entry="album"
    th:classappend="${entry.genderId == 2 ? 'ct-male' : (entry.genderId == 1 ? 'ct-female' : '')}"
    th:attr="data-album-id=${entry.albumId},data-gender=${entry.genderId},data-weeks-at-peak=${entry.weeksAtPeak != null ? 'x' + entry.weeksAtPeak : '-'}">
    <th:block th:replace="~{fragments/weekly-chart-rows :: lead(${entry}, ${mode})}"></th:block>
    <td class="wk-c-cover">
        <a class="co-cover wk-cover" th:href="@{/albums/{id}(id=${entry.albumId})}" tabindex="-1" aria-hidden="true">
            <img th:if="${entry.hasImage}" th:src="@{/albums/{id}/image(id=${entry.albumId}, thumbnail=true)}" alt="" loading="lazy">
        </a>
    </td>
    <td class="wk-c-name" th:attr="data-sort-val=${entry.albumName}">
        <a class="wk-name" th:href="@{/albums/{id}(id=${entry.albumId})}" th:text="${entry.albumName}">Album</a>
        <a class="wk-artist" th:href="@{/artists/{id}(id=${entry.artistId})}" th:text="${entry.artistName}">Artist</a>
    </td>
    <th:block th:replace="~{fragments/weekly-chart-rows :: stats(${entry}, ${mode})}"></th:block>
</tr>

<!-- Summary strip above a chart: the #1 entry and the male / female split of the chart -->
<div th:fragment="summary(kind, rows, top)" class="co-summary wk-summary" th:if="${rows != null and !rows.isEmpty()}"
     th:with="total=${#lists.size(rows)}, male=${#lists.size(rows.?[genderId == 2])}, female=${#lists.size(rows.?[genderId == 1])}, other=${total - male - female}">
    <div th:if="${top != null}" class="wk-hero" th:classappend="${top.genderId == 2 ? 'ct-male' : (top.genderId == 1 ? 'ct-female' : '')}">
        <a class="co-cover wk-hero-cover" th:href="${kind == 'album'} ? @{/albums/{id}(id=${top.albumId})} : @{/songs/{id}(id=${top.songId})}" tabindex="-1" aria-hidden="true">
            <th:block th:if="${kind == 'album'}">
                <img th:if="${top.hasImage}" th:src="@{/albums/{id}/image(id=${top.albumId})}" alt="">
            </th:block>
            <th:block th:unless="${kind == 'album'}">
                <img th:if="${top.albumHasImage and top.albumId != null}" th:src="@{/albums/{id}/image(id=${top.albumId})}" alt="">
                <img th:if="${!top.albumHasImage and top.hasImage}" th:src="@{/songs/{id}/image(id=${top.songId})}" alt="">
            </th:block>
        </a>
        <div class="wk-hero-body">
            <span class="co-eyebrow wk-gold" th:text="${kind == 'album' ? 'Number one album' : 'Number one song'}">Number one song</span>
            <a class="wk-hero-title" th:href="${kind == 'album'} ? @{/albums/{id}(id=${top.albumId})} : @{/songs/{id}(id=${top.songId})}"
               th:text="${kind == 'album' ? top.albumName : top.songName}">Title</a>
            <a class="wk-hero-artist" th:href="@{/artists/{id}(id=${top.artistId})}" th:text="${top.artistName}">Artist</a>
            <div class="wk-hero-meta">
                <span><b class="co-num" th:text="${top.playCount != null ? #numbers.formatInteger(top.playCount, 1, 'COMMA') : '-'}">0</b> plays</span>
                <span th:if="${top.weeksOnChart != null}"><b class="co-num" th:text="${top.weeksOnChart}">1</b> <th:block th:text="${top.weeksOnChart == 1 ? 'week' : 'weeks'}">weeks</th:block> on chart</span>
                <span th:if="${top.peakPosition == 1 and top.weeksAtPeak != null}"><b class="co-num" th:text="${top.weeksAtPeak}">1</b> <th:block th:text="${top.weeksAtPeak == 1 ? 'week' : 'weeks'}">weeks</th:block> at #1</span>
            </div>
        </div>
    </div>
    <div class="co-kpi wk-kpi">
        <span class="co-eyebrow">Male share</span>
        <span class="co-kpi-value wk-male-value" th:classappend="${male == total ? 'wk-full' : ''}"
              th:text="${#numbers.formatDecimal(male * 100.0 / total, 1, 0) + '%'}">70%</span>
        <span class="co-kpi-sub" th:text="${male + ' male · ' + female + ' female' + (other > 0 ? ' · ' + other + ' other' : '')}">14 male · 6 female</span>
        <span class="co-kpi-bar" aria-hidden="true">
            <i class="male" th:style="${'width:' + (male * 100.0 / total) + '%'}"></i>
            <i class="female" th:style="${'width:' + (female * 100.0 / total) + '%'}"></i>
            <i class="other" th:style="${'width:' + (other * 100.0 / total) + '%'}"></i>
        </span>
    </div>
</div>

<!-- Genre / Ethnicity / Language / Country tiles: one slim row under the summary, every value with its count -->
<div th:fragment="breakdowns(list)" class="wk-breakdowns" th:if="${list != null and !list.isEmpty() and list[0].total > 0}">
    <div th:each="b : ${list}" class="wk-bd" th:classappend="${'wk-bd-' + b.key}"
         th:title="${b.label + ': ' + #strings.listJoin(b.slices.![name + ' ' + count + ' (' + percent + '%)'], ', ')}">
        <div class="wk-bd-head">
            <span class="co-eyebrow" th:text="${b.label}">Genre</span>
            <span class="wk-bd-top"><span th:text="${b.top.name}">Pop</span> <b class="co-num" th:text="${b.top.percent + '%'}">88%</b></span>
        </div>
        <span class="wk-bd-bar" aria-hidden="true">
            <i th:each="s, st : ${b.slices}" th:classappend="${s.name == 'Unknown' ? 'wk-unknown' : ''}"
               th:style="${'width:' + (s.count * 100.0 / b.total) + '%;--i:' + st.index}"></i>
        </span>
        <div class="wk-bd-list">
            <span th:each="s, st : ${b.slices}" class="wk-bd-item" th:classappend="${s.name == 'Unknown' ? 'wk-unknown' : ''}">
                <i th:style="${'--i:' + st.index}"></i><th:block th:text="${s.name}">Pop</th:block> <b class="co-num" th:text="${s.count}">15</b>
            </span>
        </div>
    </div>
</div>

</body>
</html>
