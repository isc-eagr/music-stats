<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Music Stats'">Years - Music Stats</title>
    <link rel="stylesheet" th:href="@{/css/global.css(v=3)}">
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/catalog-list.css}">
    <th:block th:replace="~{fragments/share-history :: styles}"></th:block>
    <th:block th:replace="~{fragments/catalog-row :: row-styles}"></th:block>
    <script th:src="@{/js/list-utils.js(v=2)}"></script>
</head>
<body>
    <th:block th:replace="~{fragments/navigation :: navigation}"></th:block>
    <div class="container">
        <div class="toolbar catalog-toolbar">
            <div class="catalog-toolbar-header">
                <div class="catalog-toolbar-heading">
                    <h1 class="catalog-toolbar-title" th:text="${pageTitle}">Years</h1>
                    <div class="view-toggle" id="catalogViewToggle" role="tablist" aria-label="Year views">
                        <button type="button" class="view-btn active" id="viewBtn-card" onclick="switchCatalogView('card')">Cards</button>
                        <button type="button" class="view-btn" id="viewBtn-table" onclick="switchCatalogView('table')">Table</button>
                    </div>
                </div>
            </div>

            <div class="controls catalog-toolbar-controls">
                <div class="toolbar-sort-panel">
                    <div class="toolbar-sort-heading">Sort</div>
                    <div class="toolbar-sort-list">
                        <div class="sort-by-section toolbar-sort-row">
                            <label for="sortBySelect" class="toolbar-sort-label">1</label>
                            <select id="sortBySelect" onchange="changeSortBy(this.value)">
                                <option value="albums" th:selected="${sortBy == 'albums'}">Album Count</option>
                                <option value="artists" th:selected="${sortBy == 'artists'}">Artist Count</option>
                                <option value="malealbumpct" th:selected="${sortBy == 'malealbumpct'}">Male Album %</option>
                                <option value="maleartistpct" th:selected="${sortBy == 'maleartistpct'}">Male Artist %</option>
                                <option value="maleplaypct" th:selected="${sortBy == 'maleplaypct'}">Male Play %</option>
                                <option value="malesongpct" th:selected="${sortBy == 'malesongpct'}">Male Song %</option>
                                <option value="maletimepct" th:selected="${sortBy == 'maletimepct'}">Male Time %</option>
                                <option value="plays" th:selected="${sortBy == 'plays'}">Play Count</option>
                                <option value="primary_plays" th:selected="${sortBy == 'primary_plays'}">Primary Plays</option>
                                <option value="legacy_plays" th:selected="${sortBy == 'legacy_plays'}">Legacy Plays</option>
                                <option value="random" th:selected="${sortBy == 'random'}">Random</option>
                                <option value="songs" th:selected="${sortBy == 'songs'}">Song Count</option>
                                <option value="time" th:selected="${sortBy == 'time'}">Time Listened</option>
                                <option value="year" th:selected="${sortBy == 'year'}">Year</option>
                            </select>
                            <button type="button" class="sort-dir-btn" id="sortDirBtn" onclick="toggleSortDirection()"
                                    th:title="${sortDir == 'desc' ? 'Descending (click to change)' : 'Ascending (click to change)'}">
                                <span th:if="${sortDir == 'desc'}">↓</span>
                                <span th:if="${sortDir != 'desc'}">↑</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section th:replace="~{fragments/share-history :: year-panel}"></section>

        <!-- Pagination info -->
        <div class="pagination-info">
            <span th:text="${startIndex} + ' - ' + ${endIndex} + ' of ' + ${totalCount}"></span>
        </div>

        <div id="cardView">
        <!-- Year cards grid -->
        <div class="lb-list">
            <div th:each="year, iterStat : ${years}" class="lb-row gc lb-static" th:attr="data-id=${year.year}"
                 th:data-bars="${year.malePlayCount + ' ' + year.femalePlayCount + ' ' + year.otherPlayCount + '|' + year.maleTimeListened + ' ' + year.femaleTimeListened + ' ' + year.otherTimeListened + '|' + year.maleArtistCount + ' ' + year.femaleArtistCount + ' ' + year.otherArtistCount + '|' + year.maleAlbumCount + ' ' + year.femaleAlbumCount + ' ' + year.otherAlbumCount + '|' + year.maleCount + ' ' + year.femaleCount + ' ' + year.otherCount}"
                 th:classappend="${year.malePlayCount > year.femalePlayCount} ? 'gender-male' : (${year.femalePlayCount > year.malePlayCount} ? 'gender-female' : '')">
                <span class="lb-rank" th:text="${iterStat.count}">1</span>
                <div class="lb-name">
                    <div class="lb-title">
                        <h3 class="lb-h">
                            <a th:if="${yearType == 'listen'}"
                            th:href="@{/songs(accountMode='includes', listenedDateFrom=${year.year + '-01-01'}, listenedDateTo=${year.year + '-12-31'})}"
                            th:text="${year.year}"
                            class="year-link"
                            title="View graphs for this listen year">2024</a>
                            <a th:if="${yearType == 'release'}"
                            th:href="@{/songs(releaseDateMode='between', releaseDateFrom=${'01/01/' + year.year}, releaseDateTo=${'31/12/' + year.year})}"
                            th:text="${year.year}"
                            class="year-link"
                            title="View graphs for this release year">2024</a>
                        </h3>
                        <span class="lb-sub" th:text="${yearType == 'listen' ? 'Listen year' : 'Release year'}">Listen year</span>
                    </div>
                </div>
                <div th:replace="~{fragments/catalog-row :: mix(${year}, ${sortBy},
                     ${yearType == 'listen'} ? @{/artists(listenedDateFrom=${year.year + '-01-01'}, listenedDateTo=${year.year + '-12-31'}, view='table')} : null,
                     ${yearType == 'listen'} ? @{/albums(listenedDateFrom=${year.year + '-01-01'}, listenedDateTo=${year.year + '-12-31'}, view='table')} : @{/albums(releaseDateMode='between', releaseDateFrom=${'01/01/' + year.year}, releaseDateTo=${'31/12/' + year.year}, view='table')},
                     ${yearType == 'listen'} ? @{/songs(listenedDateFrom=${year.year + '-01-01'}, listenedDateTo=${year.year + '-12-31'}, view='table')} : @{/songs(releaseDateMode='between', releaseDateFrom=${'01/01/' + year.year}, releaseDateTo=${'31/12/' + year.year}, view='table')})}"></div>
                <div class="lb-foot">
                    <div class="sort-metric" th:if="${sortBy != defaultSortBy and sortBy != 'random' and sortBy != 'plays' and sortBy != 'primary_plays' and sortBy != 'legacy_plays' and sortBy != 'time' and sortBy != 'artists' and sortBy != 'albums' and sortBy != 'songs'}">
                        <span class="sort-metric-label" th:switch="${sortBy}">
                            <th:block th:case="'maleartistpct'">Male Artist %</th:block>
                            <th:block th:case="'malealbumpct'">Male Album %</th:block>
                            <th:block th:case="'malesongpct'">Male Song %</th:block>
                            <th:block th:case="'maleplaypct'">Male Play %</th:block>
                            <th:block th:case="'maletimepct'">Male Time %</th:block>
                        </span>
                        <span class="sort-metric-value" th:switch="${sortBy}">
                            <th:block th:case="'maleartistpct'" th:text="${year.artistCount > 0 ? #numbers.formatDecimal(year.maleArtistCount * 100.0 / year.artistCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'malealbumpct'" th:text="${year.albumCount > 0 ? #numbers.formatDecimal(year.maleAlbumCount * 100.0 / year.albumCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'malesongpct'" th:text="${year.songCount > 0 ? #numbers.formatDecimal(year.maleSongCount * 100.0 / year.songCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'maleplaypct'" th:text="${year.playCount > 0 ? #numbers.formatDecimal(year.malePlayCount * 100.0 / year.playCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'maletimepct'" th:text="${year.timeListened > 0 ? #numbers.formatDecimal(year.maleTimeListened * 100.0 / year.timeListened, 1, 2) + '%' : 'N/A'}"></th:block>
                        </span>
                    </div>
                    <div th:replace="~{fragments/catalog-row :: tops(${year})}"></div>
                    <span th:replace="~{fragments/catalog-row :: accounts-split(${year}, ${year.showLegacy})}"></span>
                </div>
            </div>
        </div>
        </div>

        <div id="tableView" style="display:none;">
            <th:block th:replace="~{fragments/catalog-list-table :: year-table(${years}, 'years', true, true)}"></th:block>
        </div>

    </div>

    <script th:inline="javascript">
        const yearType = /*[[${yearType}]]*/ 'listen';
        const basePath = '/' + yearType + '-years';

        function changeSortBy(sortValue) {
            const url = new URL(window.location);
            url.searchParams.set('sortby', sortValue);
            syncRandomSeedParam(url, { refresh: sortValue === 'random' });
            window.location.href = url.toString();
        }

        function toggleSortDirection() {
            const url = new URL(window.location);
            const currentDir = url.searchParams.get('sortdir') || 'asc';
            url.searchParams.set('sortdir', currentDir === 'asc' ? 'desc' : 'asc');
            syncRandomSeedParam(url);
            window.location.href = url.toString();
        }
    </script>
    <th:block th:replace="~{fragments/share-history :: year-scripts}"></th:block>

</body>
</html>
