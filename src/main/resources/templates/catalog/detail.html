<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${d.name} + ' - Music Stats'">Catalog Detail</title>
    <link rel="stylesheet" th:href="@{/css/global.css(v=3)}">
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/detail-general.css(v=13)}">
    <link rel="stylesheet" th:href="@{/css/detail-plays.css(v=3)}">
    <link rel="stylesheet" th:href="@{/css/catalog-detail.css(v=7)}">
    <script defer th:src="@{/js/catalog-detail.js(v=2)}"></script>
</head>
<body>
<th:block th:replace="~{fragments/navigation :: navigation}"></th:block>

<div class="container-wide dt-page cd-page" th:classappend="${d.theme}">

    <nav class="cd-crumb" aria-label="Breadcrumb">
        <a th:href="@{'/' + ${d.dimension.path}}" th:text="${d.dimension.plural}">Genres</a>
        <span aria-hidden="true">/</span>
        <span class="cd-crumb-here" th:text="${d.name}">Name</span>
    </nav>

    <!-- Hero: name (parent genre in the eyebrow, play dates under it), where it stands, totals and the filtered list links -->
    <section class="dt-card cd-hero">
        <div class="cd-hero-top">
            <div class="cd-hero-name">
                <span class="cd-eyebrow"><th:block th:text="${d.typeLabel}">Genre</th:block><th:block th:if="${d.parentName != null}"> of
                    <a th:href="@{${d.parentHref}}" th:text="${d.parentName}">Reggaeton</a></th:block></span>
                <h1 th:text="${d.name}">Name</h1>
                <span th:if="${d.firstPlay != null}" class="cd-hero-sub"
                      th:text="'First play ' + ${d.firstPlay} + (${d.lastPlay != null} ? ' · last play ' + ${d.lastPlay} : '')">First play</span>
            </div>
            <div class="cd-standing" th:if="${d.rankLabel != null or d.shareLabel != null}">
                <th:block th:if="${d.rankLabel != null}" th:with="rank=${#strings.substringBefore(d.rankLabel, ' ')}">
                    <div th:replace="~{fragments/detail-sections :: stand(${rank}, ${#strings.substringAfter(d.rankLabel, ' ')} + ' by plays', null,
                            ${rank == '#1' or rank == '#2' or rank == '#3'})}"></div>
                </th:block>
                <th:block th:if="${d.shareLabel != null}">
                    <div th:replace="~{fragments/detail-sections :: stand(${#strings.substringBefore(d.shareLabel, ' ')},
                            ${#strings.substringAfter(d.shareLabel, ' ')}, null, false)}"></div>
                </th:block>
            </div>
        </div>
        <div class="cd-tiles">
            <div th:each="s : ${d.stats}" class="cd-tile">
                <span class="cd-tile-l" th:text="${s.label}">Plays</span>
                <span class="cd-tile-v dt-num" th:text="${s.value}">0</span>
            </div>
            <a th:each="l : ${d.links}" class="cd-tile is-link" th:href="@{${l.href}}"
               th:title="'Open the ' + ${l.label} + ' list filtered to ' + ${d.name}">
                <span class="cd-tile-l"><span th:text="${l.label}">Artists</span>
                    <svg class="dt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
                <span class="cd-tile-v dt-num" th:text="${l.value}">0</span>
            </a>
        </div>
    </section>

    <!-- Plays (or time) per year by gender, with the rank among its peers under each year -->
    <section class="dt-card cd-card cd-years" th:if="${!#lists.isEmpty(d.years)}" data-cd-years>
        <div class="cd-head">
            <p class="dt-cap">Over the years</p>
            <div class="cd-head-r">
                <span class="cd-legend"><i class="is-m"></i>Male<i class="is-f"></i>Female</span>
                <div class="cd-toggle" role="group" aria-label="Measure">
                    <button type="button" class="is-on" aria-pressed="true" data-cd-measure="plays">Plays</button>
                    <button type="button" aria-pressed="false" data-cd-measure="time">Time</button>
                </div>
            </div>
        </div>
        <svg class="cd-stream" viewBox="0 0 1000 220" preserveAspectRatio="none" role="img"
             th:attr="aria-label=${d.name} + ' plays per year by gender'" data-cd-stream="plays">
            <path class="is-m" th:attr="d=${d.playsStream.male}"/>
            <path class="is-o" th:attr="d=${d.playsStream.other}"/>
            <path class="is-f" th:attr="d=${d.playsStream.female}"/>
        </svg>
        <svg class="cd-stream" viewBox="0 0 1000 220" preserveAspectRatio="none" role="img" hidden
             th:attr="aria-label=${d.name} + ' time listened per year by gender'" data-cd-stream="time">
            <path class="is-m" th:attr="d=${d.timeStream.male}"/>
            <path class="is-o" th:attr="d=${d.timeStream.other}"/>
            <path class="is-f" th:attr="d=${d.timeStream.female}"/>
        </svg>
        <div class="cd-pills" th:style="|grid-template-columns: repeat(${#lists.size(d.years)}, minmax(0, 1fr))|">
            <div th:each="y : ${d.years}" class="cd-pill">
                <span th:text="${y.label}">'05</span>
                <div class="cd-pv" data-cd-pill="plays" th:title="${y.playsTitle}"
                     th:insert="~{:: pv(${y.rank}, ${y.plays})}"></div>
                <div class="cd-pv" data-cd-pill="time" hidden th:title="${y.timeTitle}"
                     th:insert="~{:: pv(${y.timeRank}, ${y.time})}"></div>
            </div>
        </div>
        <p class="cd-note">Pill = rank among <span th:text="${#strings.toLowerCase(d.dimension.plural)}">genres</span> that year, with the year's total under it
            <span th:if="${d.playsStream.note != null}" data-cd-note="plays" th:text="' · ' + ${d.playsStream.note}"></span>
            <span th:if="${d.timeStream.note != null}" data-cd-note="time" hidden th:text="' · ' + ${d.timeStream.note}"></span></p>
    </section>

    <!-- Gender breakdown and the breakdown by another catalog (subgenres of a genre, countries of a subgenre, genres otherwise) -->
    <div class="cd-row">
        <section th:replace="~{fragments/detail-sections :: gender(${d.gender})}"></section>
        <section th:replace="~{fragments/detail-sections :: breakdown(${d.breakdownTitle}, ${d.breakdown})}"></section>
    </div>

    <!-- Mix of the other catalogs, right under the breakdowns -->
    <div th:replace="~{fragments/detail-sections :: mixes(${d.mixes})}"></div>

    <!-- Where this item sits among every peer of its catalog, all time -->
    <th:block th:if="${!#lists.isEmpty(d.byPlays)}">
        <section th:replace="~{fragments/detail-sections :: peers('Where ' + ${d.name} + ' sits among all ' + ${#lists.size(d.byPlays)} + ' ' + ${#strings.toLowerCase(d.dimension.plural)}, 'All time', ${d.byPlays}, ${d.byMale})}"></section>
    </th:block>

    <!-- When you play it: same panels as the When you listen card on the detail Plays tab -->
    <th:block th:if="${d.plays > 0}">
        <section th:replace="~{fragments/detail-sections :: when('When you play it', ${d.rhythm}, true, true)}"></section>
    </th:block>
</div>

<th:block th:if="false">
    <th:block th:fragment="pv(rank, value)">
        <b class="dt-num" th:classappend="${rank == null} ? 'is-none' : (${rank == 1} ? 'is-one' : (${rank <= 3} ? 'is-top' : ''))"
           th:text="${rank == null} ? '-' : '#' + ${rank}">#1</b>
        <small class="dt-num" th:text="${rank == null} ? '' : ${value}">0</small>
    </th:block>
</th:block>
</body>
</html>
