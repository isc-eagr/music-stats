<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subgenres - Music Stats</title>
    <link rel="stylesheet" th:href="@{/css/global.css(v=3)}">
    <link rel="stylesheet" th:href="@{/css/catalog-modal.css(v=1)}">
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/catalog-list.css}">
    <th:block th:replace="~{fragments/share-history :: styles}"></th:block>
    <th:block th:replace="~{fragments/catalog-row :: row-styles}"></th:block>
    <script th:src="@{/js/list-utils.js(v=2)}"></script>
</head>
<body>
    <th:block th:replace="~{fragments/navigation :: navigation}"></th:block>
    <div class="container">
        <div class="toolbar catalog-toolbar">
            <div class="catalog-toolbar-header">
                <div class="catalog-toolbar-heading">
                    <h1 class="catalog-toolbar-title">Subgenres</h1>
                    <div class="view-toggle" id="catalogViewToggle" role="tablist" aria-label="Subgenre views">
                        <button type="button" class="view-btn active" id="viewBtn-card" onclick="switchCatalogView('card')">Cards</button>
                        <button type="button" class="view-btn" id="viewBtn-table" onclick="switchCatalogView('table')">Table</button>
                    </div>
                </div>
                <div class="catalog-toolbar-actions">
                    <button type="button" class="toolbar-btn toolbar-btn-primary" onclick="openCreateModal()">New Subgenre</button>
                </div>
            </div>

            <div class="controls catalog-toolbar-controls">
                <div class="catalog-toolbar-search-row">
                    <div class="search-bar">
                        <form method="get" action="/subgenres" id="searchForm" class="catalog-toolbar-search-form">
                            <input type="text" autocomplete="off" name="q" th:value="${searchQuery}" placeholder="Search subgenres..." oninput="this.form.submit()" id="searchInput">
                            <input type="hidden" name="parentGenre" th:value="${selectedParentGenre}">
                        </form>
                    </div>

                    <div class="toolbar-field-panel toolbar-filter-field">
                        <label for="parentGenreSelect" class="toolbar-field-label">Parent Genre</label>
                        <select id="parentGenreSelect" onchange="changeParentGenre(this.value)">
                            <option value="">All</option>
                            <option th:each="entry : ${genres}"
                                    th:value="${entry.key}"
                                    th:text="${entry.value}"
                                    th:selected="${selectedParentGenre != null and selectedParentGenre == entry.key}"></option>
                        </select>
                    </div>
                    <div th:replace="~{fragments/saved-filters :: saved-filters}"></div>
                </div>

                <div class="toolbar-sort-panel">
                    <div class="toolbar-sort-heading">Sort</div>
                    <div class="toolbar-sort-list">
                        <div class="sort-by-section toolbar-sort-row">
                            <label for="sortBySelect" class="toolbar-sort-label">1</label>
                            <select id="sortBySelect" onchange="changeSortBy(this.value)">
                                <option value="albums" th:selected="${sortBy == 'albums'}">Album Count</option>
                                <option value="artists" th:selected="${sortBy == 'artists'}">Artist Count</option>
                                <option value="malealbumpct" th:selected="${sortBy == 'malealbumpct'}">Male Album %</option>
                                <option value="maleartistpct" th:selected="${sortBy == 'maleartistpct'}">Male Artist %</option>
                                <option value="maleplaypct" th:selected="${sortBy == 'maleplaypct'}">Male Play %</option>
                                <option value="malesongpct" th:selected="${sortBy == 'malesongpct'}">Male Song %</option>
                                <option value="maletimepct" th:selected="${sortBy == 'maletimepct'}">Male Time %</option>
                                <option value="winningdays" th:selected="${sortBy == 'winningdays'}">Winning Days</option>
                                <option value="winningweeks" th:selected="${sortBy == 'winningweeks'}">Winning Weeks</option>
                                <option value="winningmonths" th:selected="${sortBy == 'winningmonths'}">Winning Months</option>
                                <option value="winningseasons" th:selected="${sortBy == 'winningseasons'}">Winning Seasons</option>
                                <option value="winningyears" th:selected="${sortBy == 'winningyears'}">Winning Years</option>
                                <option value="winningdecades" th:selected="${sortBy == 'winningdecades'}">Winning Decades</option>
                                <option value="name" th:selected="${sortBy == 'name'}">Name</option>
                                <option value="genre" th:selected="${sortBy == 'genre'}">Parent Genre</option>
                                <option value="plays" th:selected="${sortBy == 'plays'}">Play Count</option>
                                <option value="primary_plays" th:selected="${sortBy == 'primary_plays'}">Primary Plays</option>
                                <option value="legacy_plays" th:selected="${sortBy == 'legacy_plays'}">Legacy Plays</option>
                                <option value="random" th:selected="${sortBy == 'random'}">Random</option>
                                <option value="songs" th:selected="${sortBy == 'songs'}">Song Count</option>
                                <option value="time" th:selected="${sortBy == 'time'}">Time Listened</option>
                            </select>
                            <button type="button" class="sort-dir-btn" id="sortDirBtn" onclick="toggleSortDirection()"
                                    th:title="${sortDir == 'desc' ? 'Descending (click to change)' : 'Ascending (click to change)'}">
                                <span th:if="${sortDir == 'desc'}">↓</span>
                                <span th:if="${sortDir != 'desc'}">↑</span>
                            </button>
                        </div>
                    </div>                </div>
            </div>
        </div>
        
        <!-- Active Filters Chips -->
        <div class="active-filters" id="activeFilters">
            <div class="filter-chip" th:if="${searchQuery != null and !searchQuery.isEmpty()}">
                <span class="filter-chip-label">Name is</span>
                <span class="filter-chip-value" th:text="${searchQuery}"></span>
                <button class="filter-chip-remove" onclick="removeFilter('q')" type="button">×</button>
            </div>
            
            <div class="filter-chip" th:if="${selectedParentGenre != null}">
                <span class="filter-chip-label">Parent Genre:</span>
                <span class="filter-chip-value" th:text="${genres.get(selectedParentGenre)}"></span>
                <button class="filter-chip-remove" onclick="removeFilter('parentGenre')" type="button">×</button>
            </div>
            
            <button class="clear-all-filters" onclick="clearFilters()" type="button" 
                    th:if="${(searchQuery != null and !searchQuery.isEmpty()) or selectedParentGenre != null}">
                Clear
            </button>
        </div>
        
        <!-- Pagination info -->
        <section th:replace="~{fragments/share-history :: panel('subgenres', 'plays,time,artists,albums,songs', 'data-id', 'data-filter-value')}"></section>

        <div class="pagination-info">
            <span th:text="${startIndex} + ' - ' + ${endIndex} + ' of ' + ${totalCount}"></span>
        </div>
        
        <div id="cardView">
        <!-- Subgenre cards grid -->
        <div class="lb-list">
            <div th:each="subgenre, iterStat : ${subgenres}" class="lb-row gc lb-static" th:attr="data-id=${subgenre.id}"
                 th:classappend="${subgenre.malePlayCount > subgenre.femalePlayCount} ? 'gender-male' : (${subgenre.femalePlayCount > subgenre.malePlayCount} ? 'gender-female' : '')">
                <span class="lb-rank" th:text="${iterStat.count}">1</span>
                <div class="lb-name">
                    <div class="lb-thumb" th:if="${subgenre.hasImage}">
                        <img th:src="@{'/subgenres/' + ${subgenre.id} + '/image'}" th:alt="${subgenre.name}">
                    </div>
                    <div class="lb-title">
                        <h3 class="lb-h" th:title="${subgenre.name}"><a th:href="@{/subgenres/{id}(id=${subgenre.id})}" th:text="${subgenre.name}">Name</a></h3>
                        <span class="lb-sub" th:if="${subgenre.parentGenreName != null}" th:text="${subgenre.parentGenreName}">Parent Genre</span>
                    </div>
                </div>
                <div th:replace="~{fragments/catalog-row :: mix(${subgenre}, ${sortBy}, @{/artists(subgenre=${subgenre.id}, subgenreMode='includes', view='table')}, @{/albums(subgenre=${subgenre.id}, subgenreMode='includes', view='table')}, @{/songs(subgenre=${subgenre.id}, subgenreMode='includes', view='table')})}"></div>
                <div class="lb-foot">
                    <div class="sort-metric" th:if="${sortBy != defaultSortBy and sortBy != 'random' and sortBy != 'plays' and sortBy != 'primary_plays' and sortBy != 'legacy_plays' and sortBy != 'time' and sortBy != 'artists' and sortBy != 'albums' and sortBy != 'songs' and sortBy != 'genre' and !#strings.startsWith(sortBy, 'winning')}">
                        <span class="sort-metric-label" th:switch="${sortBy}">
                            <th:block th:case="'maleartistpct'">Male Artist %</th:block>
                            <th:block th:case="'malealbumpct'">Male Album %</th:block>
                            <th:block th:case="'malesongpct'">Male Song %</th:block>
                            <th:block th:case="'maleplaypct'">Male Play %</th:block>
                            <th:block th:case="'maletimepct'">Male Time %</th:block>
                        </span>
                        <span class="sort-metric-value" th:switch="${sortBy}">
                            <th:block th:case="'maleartistpct'" th:text="${subgenre.artistCount > 0 ? #numbers.formatDecimal(subgenre.maleArtistCount * 100.0 / subgenre.artistCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'malealbumpct'" th:text="${subgenre.albumCount > 0 ? #numbers.formatDecimal(subgenre.maleAlbumCount * 100.0 / subgenre.albumCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'malesongpct'" th:text="${subgenre.songCount > 0 ? #numbers.formatDecimal(subgenre.maleSongCount * 100.0 / subgenre.songCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'maleplaypct'" th:text="${subgenre.playCount > 0 ? #numbers.formatDecimal(subgenre.malePlayCount * 100.0 / subgenre.playCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'maletimepct'" th:text="${subgenre.timeListened > 0 ? #numbers.formatDecimal(subgenre.maleTimeListened * 100.0 / subgenre.timeListened, 1, 2) + '%' : 'N/A'}"></th:block>
                        </span>
                    </div>
                    <span th:replace="~{fragments/catalog-row :: wins(${subgenre}, ${sortBy})}"></span>
                    <div th:replace="~{fragments/catalog-row :: tops(${subgenre})}"></div>
                    <span th:replace="~{fragments/catalog-row :: accounts(${subgenre})}"></span>
                </div>
            </div>
        </div>
        </div>

        <div id="tableView" style="display:none;">
            <th:block th:replace="~{fragments/catalog-list-table :: metric-table(${subgenres}, 'subgenres', true, true, true, 'subgenre', 'id', 'name', 'Subgenre')}"></th:block>
        </div>
        
    </div>
    
    <script>
        function changeSortBy(sortValue) {
            const url = new URL(window.location);
            url.searchParams.set('sortby', sortValue);
            syncRandomSeedParam(url, { refresh: sortValue === 'random' });
            window.location.href = url.toString();
        }
        
        function toggleSortDirection() {
            const url = new URL(window.location);
            const currentDir = url.searchParams.get('sortdir') || 'asc';
            url.searchParams.set('sortdir', currentDir === 'asc' ? 'desc' : 'asc');
            syncRandomSeedParam(url);
            window.location.href = url.toString();
        }
        
        function changeParentGenre(genreId) {
            const url = new URL(window.location);
            if (genreId) {
                url.searchParams.set('parentGenre', genreId);
            } else {
                url.searchParams.delete('parentGenre');
            }
            window.location.href = url.toString();
        }
        
        function clearFilters() {
            const sortBy = document.getElementById('sortBySelect').value;
            const url = new URL('/subgenres', window.location.origin);
            url.searchParams.set('sortby', sortBy);
            syncRandomSeedParam(url);
            window.location.href = url.toString();
        }
        
        function removeFilter(paramName) {
            const url = new URL(window.location);
            url.searchParams.delete(paramName);
            window.location.href = url.toString();
        }
        
        // Create Subgenre Modal Functions
        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }
        
        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
            document.getElementById('createForm').reset();
        }
        
        function submitCreate(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            const data = {
                name: formData.get('name'),
                parentGenreId: formData.get('parentGenreId') ? parseInt(formData.get('parentGenreId')) : null
            };
            
            fetch('/subgenres/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('Failed to create subgenre');
            })
            .then(data => {
                if (data.id) {
                    window.location.href = '/subgenres';
                }
            })
            .catch(error => {
                console.error('Error creating subgenre:', error);
                showErrorToast('Error creating subgenre');
            });
        }
    </script>
    
    <!-- Create Subgenre Modal -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Subgenre</h2>
                <button type="button" class="modal-close" onclick="closeCreateModal()" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
            <form id="createForm" onsubmit="submitCreate(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="createName">Name *</label>
                        <input type="text" autocomplete="off" id="createName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="createParentGenreId">Parent Genre *</label>
                        <select id="createParentGenreId" name="parentGenreId" required>
                            <option value="">Select...</option>
                            <option th:each="entry : ${genres}" 
                                    th:value="${entry.key}" 
                                    th:text="${entry.value}"></option>
                        </select>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="cm-btn" onclick="closeCreateModal()">Cancel</button>
                    <button type="submit" class="cm-btn is-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
    

    <script>
        // Auto-focus search input if there's a search query
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value) {
                searchInput.focus();
                searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
            }
        });
    </script>
    <th:block th:replace="~{fragments/share-history :: scripts}"></th:block>
</body>
</html>
