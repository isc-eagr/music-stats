<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethnicities - Music Stats</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/catalog-list.css}">
    <th:block th:replace="~{fragments/share-history :: styles}"></th:block>
    <th:block th:replace="~{fragments/catalog-row :: row-styles}"></th:block>
    <script th:src="@{/js/list-utils.js}"></script>
</head>
<body>
    <th:block th:replace="~{fragments/navigation :: navigation}"></th:block>
    <div class="container">
        <div class="toolbar catalog-toolbar">
            <div class="catalog-toolbar-header">
                <div class="catalog-toolbar-heading">
                    <h1 class="catalog-toolbar-title">Ethnicities</h1>
                    <div class="view-toggle" id="catalogViewToggle" role="tablist" aria-label="Ethnicity views">
                        <button type="button" class="view-btn active" id="viewBtn-card" onclick="switchCatalogView('card')">Cards</button>
                        <button type="button" class="view-btn" id="viewBtn-table" onclick="switchCatalogView('table')">Table</button>
                    </div>
                </div>
                <div class="catalog-toolbar-actions">
                    <button type="button" class="toolbar-btn toolbar-btn-primary" onclick="openCreateModal()">New Ethnicity</button>
                </div>
            </div>

            <div class="controls catalog-toolbar-controls">
                <div class="catalog-toolbar-search-row">
                    <div class="search-bar">
                        <form method="get" action="/ethnicities" id="ethnicitySearchForm" class="catalog-toolbar-search-form">
                            <input type="text" autocomplete="off" name="q" th:value="${searchQuery}" placeholder="Search ethnicities..." oninput="this.form.submit()" id="searchInput">
                        </form>
                    </div>
                    <div th:replace="~{fragments/saved-filters :: saved-filters}"></div>
                </div>

                <div class="toolbar-sort-panel">
                    <div class="toolbar-sort-heading">Sort</div>
                    <div class="toolbar-sort-list">
                        <div class="sort-by-section toolbar-sort-row">
                            <label for="sortBySelect" class="toolbar-sort-label">1</label>
                            <select id="sortBySelect" onchange="changeSortBy(this.value)">
                                <option value="albums" th:selected="${sortBy == 'albums'}">Album Count</option>
                                <option value="artists" th:selected="${sortBy == 'artists'}">Artist Count</option>
                                <option value="malealbumpct" th:selected="${sortBy == 'malealbumpct'}">Male Album %</option>
                                <option value="maleartistpct" th:selected="${sortBy == 'maleartistpct'}">Male Artist %</option>
                                <option value="maleplaypct" th:selected="${sortBy == 'maleplaypct'}">Male Play %</option>
                                <option value="malesongpct" th:selected="${sortBy == 'malesongpct'}">Male Song %</option>
                                <option value="maletimepct" th:selected="${sortBy == 'maletimepct'}">Male Time %</option>
                                <option value="winningdays" th:selected="${sortBy == 'winningdays'}">Winning Days</option>
                                <option value="winningweeks" th:selected="${sortBy == 'winningweeks'}">Winning Weeks</option>
                                <option value="winningmonths" th:selected="${sortBy == 'winningmonths'}">Winning Months</option>
                                <option value="winningseasons" th:selected="${sortBy == 'winningseasons'}">Winning Seasons</option>
                                <option value="winningyears" th:selected="${sortBy == 'winningyears'}">Winning Years</option>
                                <option value="winningdecades" th:selected="${sortBy == 'winningdecades'}">Winning Decades</option>
                                <option value="name" th:selected="${sortBy == 'name'}">Name</option>
                                <option value="plays" th:selected="${sortBy == 'plays'}">Play Count</option>
                                <option value="primary_plays" th:selected="${sortBy == 'primary_plays'}">Primary Plays</option>
                                <option value="legacy_plays" th:selected="${sortBy == 'legacy_plays'}">Legacy Plays</option>
                                <option value="random" th:selected="${sortBy == 'random'}">Random</option>
                                <option value="songs" th:selected="${sortBy == 'songs'}">Song Count</option>
                                <option value="time" th:selected="${sortBy == 'time'}">Time Listened</option>
                            </select>
                            <button type="button" class="sort-dir-btn" id="sortDirBtn" onclick="toggleSortDirection()"
                                    th:title="${sortDir == 'desc' ? 'Descending (click to change)' : 'Ascending (click to change)'}">
                                <span th:if="${sortDir == 'desc'}">↓</span>
                                <span th:if="${sortDir != 'desc'}">↑</span>
                            </button>
                        </div>
                    </div>                </div>
            </div>
        </div>
        
        <!-- Active Filters Chips -->
        <div class="active-filters" id="activeFilters">
            <div class="filter-chip" th:if="${searchQuery != null and !searchQuery.isEmpty()}">
                <span class="filter-chip-label">Name is</span>
                <span class="filter-chip-value" th:text="${searchQuery}"></span>
                <button class="filter-chip-remove" onclick="removeFilter('q')" type="button">×</button>
            </div>
            
            <button class="clear-all-filters" onclick="clearFilters()" type="button" 
                    th:if="${searchQuery != null and !searchQuery.isEmpty()}">
                Clear
            </button>
        </div>
        
        <!-- Pagination info -->
        <section th:replace="~{fragments/share-history :: panel('ethnicities', 'plays,time,artists,albums,songs', 'data-id', 'data-filter-value')}"></section>

        <div class="pagination-info">
            <span th:text="${startIndex} + ' - ' + ${endIndex} + ' of ' + ${totalCount}"></span>
        </div>
        
        <div id="cardView">
        <!-- Ethnicity cards grid -->
        <div class="lb-list">
            <div th:each="ethnicity, iterStat : ${ethnicities}" class="lb-row gc lb-static" th:attr="data-id=${ethnicity.id}"
                 th:classappend="${ethnicity.malePlayCount > ethnicity.femalePlayCount} ? 'gender-male' : (${ethnicity.femalePlayCount > ethnicity.malePlayCount} ? 'gender-female' : '')">
                <span class="lb-rank" th:text="${iterStat.count}">1</span>
                <div class="lb-name">
                    <div class="lb-thumb" th:if="${ethnicity.hasImage}">
                        <img th:src="@{'/ethnicities/' + ${ethnicity.id} + '/image'}" th:alt="${ethnicity.name}">
                    </div>
                    <div class="lb-title">
                        <h3 class="lb-h" th:title="${ethnicity.name}"><a th:href="@{/ethnicities/{id}(id=${ethnicity.id})}" th:text="${ethnicity.name}">Name</a></h3>
                    </div>
                </div>
                <div th:replace="~{fragments/catalog-row :: mix(${ethnicity}, ${sortBy}, @{/artists(ethnicity=${ethnicity.id}, ethnicityMode='includes', view='table')}, @{/albums(ethnicity=${ethnicity.id}, ethnicityMode='includes', view='table')}, @{/songs(ethnicity=${ethnicity.id}, ethnicityMode='includes', view='table')})}"></div>
                <div class="lb-foot">
                    <div class="sort-metric" th:if="${sortBy != defaultSortBy and sortBy != 'random' and sortBy != 'plays' and sortBy != 'primary_plays' and sortBy != 'legacy_plays' and sortBy != 'time' and sortBy != 'artists' and sortBy != 'albums' and sortBy != 'songs' and !#strings.startsWith(sortBy, 'winning')}">
                        <span class="sort-metric-label" th:switch="${sortBy}">
                            <th:block th:case="'maleartistpct'">Male Artist %</th:block>
                            <th:block th:case="'malealbumpct'">Male Album %</th:block>
                            <th:block th:case="'malesongpct'">Male Song %</th:block>
                            <th:block th:case="'maleplaypct'">Male Play %</th:block>
                            <th:block th:case="'maletimepct'">Male Time %</th:block>
                        </span>
                        <span class="sort-metric-value" th:switch="${sortBy}">
                            <th:block th:case="'maleartistpct'" th:text="${ethnicity.artistCount > 0 ? #numbers.formatDecimal(ethnicity.maleArtistCount * 100.0 / ethnicity.artistCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'malealbumpct'" th:text="${ethnicity.albumCount > 0 ? #numbers.formatDecimal(ethnicity.maleAlbumCount * 100.0 / ethnicity.albumCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'malesongpct'" th:text="${ethnicity.songCount > 0 ? #numbers.formatDecimal(ethnicity.maleSongCount * 100.0 / ethnicity.songCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'maleplaypct'" th:text="${ethnicity.playCount > 0 ? #numbers.formatDecimal(ethnicity.malePlayCount * 100.0 / ethnicity.playCount, 1, 2) + '%' : 'N/A'}"></th:block>
                            <th:block th:case="'maletimepct'" th:text="${ethnicity.timeListened > 0 ? #numbers.formatDecimal(ethnicity.maleTimeListened * 100.0 / ethnicity.timeListened, 1, 2) + '%' : 'N/A'}"></th:block>
                        </span>
                    </div>
                    <span th:replace="~{fragments/catalog-row :: wins(${ethnicity}, ${sortBy})}"></span>
                    <div th:replace="~{fragments/catalog-row :: tops(${ethnicity})}"></div>
                    <span th:replace="~{fragments/catalog-row :: accounts(${ethnicity})}"></span>
                </div>
            </div>
        </div>
        </div>

        <div id="tableView" style="display:none;">
            <th:block th:replace="~{fragments/catalog-list-table :: metric-table(${ethnicities}, 'ethnicities', false, true, true, 'ethnicity', 'id', 'name', 'Ethnicity')}"></th:block>
        </div>
        
        <!-- Pagination controls (bottom) -->
    </div>
    
    <script>
        function changeSortBy(sortValue) {
            const url = new URL(window.location);
            url.searchParams.set('sortby', sortValue);
            syncRandomSeedParam(url, { refresh: sortValue === 'random' });
            url.searchParams.set('page', '0');
            window.location.href = url.toString();
        }
        
        function toggleSortDirection() {
            const url = new URL(window.location);
            const currentDir = url.searchParams.get('sortdir') || 'asc';
            url.searchParams.set('sortdir', currentDir === 'asc' ? 'desc' : 'asc');
            syncRandomSeedParam(url);
            url.searchParams.set('page', '0');
            window.location.href = url.toString();
        }
        
        function clearFilters() {
            const sortBy = document.getElementById('sortBySelect').value;
            const url = new URL('/ethnicities', window.location.origin);
            url.searchParams.set('sortby', sortBy);
            syncRandomSeedParam(url);
            window.location.href = url.toString();
        }
        
        function removeFilter(paramName) {
            const url = new URL(window.location);
            url.searchParams.delete(paramName);
            window.location.href = url.toString();
        }
        
        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }
        
        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
            document.getElementById('createForm').reset();
        }
        
        function submitCreate(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            const data = { name: formData.get('name') };
            
            fetch('/ethnicities/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('Failed to create ethnicity');
            })
            .then(data => {
                if (data.id) {
                    window.location.href = '/ethnicities';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showErrorToast('Error creating ethnicity');
            });
        }
    </script>
    
    <!-- Create Ethnicity Modal -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Ethnicity</h2>
                <span class="modal-close" onclick="closeCreateModal()">&times;</span>
            </div>
            <form id="createForm" onsubmit="submitCreate(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="createName">Name *</label>
                        <input type="text" autocomplete="off" id="createName" name="name" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-action">Create</button>
                    <button type="button" class="btn-negative" onclick="closeCreateModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #1a1a1a;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #333;
        }
        .modal-header h2 { margin: 0; color: #fff; }
        .modal-close { color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; }
        .modal-body { padding: 20px; }
        .modal-body .form-group { margin-bottom: 15px; }
        .modal-body .form-group label { display: block; margin-bottom: 5px; color: #ccc; }
        .modal-body .form-group input {
            width: 100%;
            padding: 8px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #333;
            justify-content: flex-end;
        }
    </style>
    <script>
        // Auto-focus search input if there's a search query
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value) {
                searchInput.focus();
                searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
            }
        });
    </script>
    <th:block th:replace="~{fragments/share-history :: scripts}"></th:block>
</body>
</html>
