<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags - Music Stats</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/catalog-list.css}">
    <th:block th:replace="~{fragments/catalog-row :: row-styles}"></th:block>
    <style>
        .tags-page {
            max-width: 1800px;
            margin: 28px auto 48px;
            padding: 0 32px;
        }
        .tags-toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 18px;
            align-items: end;
            margin-bottom: 18px;
        }
        .tags-title h1 {
            margin: 0;
            font-size: 1.6rem;
            line-height: 1.1;
        }
        .tags-title span {
            display: block;
            margin-top: 6px;
            color: #888;
            font-size: 0.9rem;
        }
        .tag-create-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .tag-create-form input {
            width: min(320px, 48vw);
            height: 38px;
            padding: 0 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #111;
            color: #f4f7fa;
            font-size: 14px;
        }
        .tag-create-form input:focus {
            outline: none;
            border-color: #555;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
        }
        .tag-create-form button {
            height: 38px;
            padding: 0 14px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .tag-create-form button:hover {
            background: #333;
            border-color: #555;
        }
        .tag-delete-form {
            margin-left: auto;
        }
        .tag-delete-button {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: #666;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }
        .tag-delete-button:hover {
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.35);
            background: rgba(127, 29, 29, 0.28);
        }
        .tag-alert {
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .tag-alert-success {
            background: rgba(34, 197, 94, 0.16);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #b7f7cc;
        }
        .tag-alert-error {
            background: rgba(239, 68, 68, 0.16);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fecaca;
        }
        .tag-empty {
            padding: 42px;
            border: 1px dashed #333;
            border-radius: 8px;
            color: #888;
            text-align: center;
        }
        @media (max-width: 720px) {
            .tags-page {
                padding: 0 16px;
            }
            .tags-toolbar {
                grid-template-columns: 1fr;
            }
            .tag-create-form {
                width: 100%;
            }
            .tag-create-form input {
                flex: 1;
                width: auto;
            }
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/navigation :: navigation}"></th:block>

    <main class="tags-page">
        <div class="tags-toolbar">
            <div class="tags-title">
                <h1>Tags</h1>
                <span><span th:text="${tagCount}">0</span> total</span>
            </div>
            <form class="tag-create-form" th:action="@{/tags}" method="post">
                <input type="text" name="name" placeholder="New tag name" maxlength="100" required>
                <button type="submit">Create Tag</button>
            </form>
        </div>

        <div th:if="${successMessage}" class="tag-alert tag-alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="tag-alert tag-alert-error" th:text="${errorMessage}"></div>

        <div class="lb-list" th:if="${tags != null and !tags.isEmpty()}">
            <article class="lb-row gc lb-static tag-row" th:each="tag, iterStat : ${tags}"
                     th:classappend="${tag.maleSongCount > tag.femaleSongCount} ? 'gender-male' : (${tag.femaleSongCount > tag.maleSongCount} ? 'gender-female' : '')">
                <span class="lb-rank" th:text="${iterStat.count}">1</span>
                <div class="lb-name">
                    <div class="lb-title">
                        <h3 class="lb-h" th:text="${tag.name}" th:title="${tag.name}">Tag Name</h3>
                        <span class="lb-sub">Tag</span>
                    </div>
                </div>
                <div class="lb-mix">
                    <th:block th:replace="~{fragments/catalog-row :: linked-metric(@{/artists(tag=${tag.id}, tagMode='includes', view='table')}, 'Artists', ${#numbers.formatInteger(tag.artistCount, 1, 'COMMA')}, ${tag.maleArtistCount}, ${tag.femaleArtistCount}, ${tag.otherArtistCount}, false)}"></th:block>
                    <th:block th:replace="~{fragments/catalog-row :: linked-metric(@{/albums(tag=${tag.id}, tagMode='includes', view='table')}, 'Albums', ${#numbers.formatInteger(tag.albumCount, 1, 'COMMA')}, ${tag.maleAlbumCount}, ${tag.femaleAlbumCount}, ${tag.otherAlbumCount}, false)}"></th:block>
                    <th:block th:replace="~{fragments/catalog-row :: linked-metric(@{/songs(tag=${tag.id}, tagMode='includes', view='table')}, 'Songs', ${#numbers.formatInteger(tag.songCount, 1, 'COMMA')}, ${tag.maleSongCount}, ${tag.femaleSongCount}, ${tag.otherSongCount}, false)}"></th:block>
                </div>
                <div class="lb-foot">
                    <div th:replace="~{fragments/catalog-row :: tops(${tag})}"></div>
                    <form class="tag-delete-form"
                          th:action="@{/tags/{id}/delete(id=${tag.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this tag and clear it from all artists, albums, and songs?');">
                        <button type="submit" class="tag-delete-button" title="Delete tag" aria-label="Delete tag">&times;</button>
                    </form>
                </div>
            </article>
        </div>

        <div class="tag-empty" th:if="${tags == null or tags.isEmpty()}">
            No tags yet.
        </div>
    </main>
</body>
</html>
