<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Stats</title>
    <link rel="stylesheet" th:href="@{/css/global.css(v=3)}" />
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/detail-general.css(v=13)}" />
    <link rel="stylesheet" th:href="@{/css/detail-plays.css(v=3)}" />
    <link rel="stylesheet" th:href="@{/css/catalog-detail.css(v=7)}" />
    <link rel="stylesheet" th:href="@{/css/home.css(v=1)}" />
</head>
<body>
    <th:block th:replace="~{fragments/navigation :: navigation}"></th:block>

    <main class="container-wide dt-page hm-page">
        <div class="hm-head">
            <span class="hm-eyebrow">Library</span>
            <h1>Music Stats</h1>
            <p class="hm-sub">Explore your music library</p>
        </div>

        <div class="hm-tiles">
            <a class="hm-tile" th:href="@{/artists}">
                <span class="hm-tile-top">
                    <span class="hm-tile-mark"><svg class="hm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg></span>
                    Artists
                </span>
                <span class="hm-tile-value" th:text="${#numbers.formatInteger(totalArtists, 1, 'COMMA')}">0</span>
            </a>
            <a class="hm-tile" th:href="@{/albums}">
                <span class="hm-tile-top">
                    <span class="hm-tile-mark"><svg class="hm-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg></span>
                    Albums
                </span>
                <span class="hm-tile-value" th:text="${#numbers.formatInteger(totalAlbums, 1, 'COMMA')}">0</span>
            </a>
            <a class="hm-tile" th:href="@{/songs}">
                <span class="hm-tile-top">
                    <span class="hm-tile-mark"><svg class="hm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
                    Songs
                </span>
                <span class="hm-tile-value" th:text="${#numbers.formatInteger(totalSongs, 1, 'COMMA')}">0</span>
            </a>
            <div class="hm-tile">
                <span class="hm-tile-top">
                    <span class="hm-tile-mark"><svg class="hm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 3 14 9-14 9V3Z"/></svg></span>
                    Plays
                </span>
                <span class="hm-tile-value" th:text="${totalPlays != null ? #numbers.formatInteger(totalPlays, 1, 'COMMA') : 0}">0</span>
                <span class="hm-tile-split">
                    <span title="Primary (vatito)">Primary <b th:text="${primaryPlays != null ? #numbers.formatInteger(primaryPlays, 1, 'COMMA') : 0}">0</b></span>
                    <span title="Legacy (robertlover)">Legacy <b th:text="${legacyPlays != null ? #numbers.formatInteger(legacyPlays, 1, 'COMMA') : 0}">0</b></span>
                </span>
            </div>
            <div class="hm-tile">
                <span class="hm-tile-top">
                    <span class="hm-tile-mark"><svg class="hm-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
                    Time listening
                </span>
                <span class="hm-tile-value" th:text="${totalListeningTime}">0h 0m</span>
            </div>
        </div>

        <section class="hm-card">
            <p class="hm-cap">Gender breakdown</p>
            <div class="hm-rows">
                <th:block th:replace="~{this :: genderRow('Artists', ${artistsByGender}, false)}"></th:block>
                <th:block th:replace="~{this :: genderRow('Albums', ${albumsByGender}, false)}"></th:block>
                <th:block th:replace="~{this :: genderRow('Songs', ${songsByGender}, false)}"></th:block>
                <th:block th:replace="~{this :: genderRow('Plays', ${playsByGender}, false)}"></th:block>
                <th:block th:replace="~{this :: genderRow('Time', ${listeningTimeByGender}, true)}"></th:block>
            </div>
            <div class="hm-legend">
                <span><i class="hm-dot is-male"></i>Male</span>
                <span><i class="hm-dot is-female"></i>Female</span>
                <span><i class="hm-dot is-other"></i>Other</span>
            </div>
        </section>

        <!-- Same panels as When you listen on the detail Plays tab, over every play in the library -->
        <section th:replace="~{fragments/detail-sections :: when('When you listen', ${rhythm}, true, true)}"></section>
    </main>

    <!-- One gender split row: label, blue/pink/gray bar, male and female share with their counts (hours for Time) -->
    <th:block th:if="${false}">
        <div th:fragment="genderRow(label, counts, isTime)" class="hm-row"
             th:with="m=${counts.get('male') ?: 0}, f=${counts.get('female') ?: 0}, o=${counts.get('other') ?: 0}, total=${m + f + o}">
            <span class="hm-row-label" th:text="${label}">Artists</span>
            <div class="hm-bar">
                <span class="is-male" th:if="${total > 0}" th:style="'width:' + ${m * 100.0 / total} + '%'"
                      th:title="'Male: ' + ${#numbers.formatDecimal(m * 100.0 / total, 1, 2)} + '%'"></span>
                <span class="is-female" th:if="${total > 0}" th:style="'width:' + ${f * 100.0 / total} + '%'"
                      th:title="'Female: ' + ${#numbers.formatDecimal(f * 100.0 / total, 1, 2)} + '%'"></span>
                <span class="is-other" th:if="${total > 0}" th:style="'width:' + ${o * 100.0 / total} + '%'"
                      th:title="'Other: ' + ${#numbers.formatDecimal(o * 100.0 / total, 1, 2)} + '%'"></span>
            </div>
            <span class="hm-share is-male" title="Male">
                <span class="hm-share-pct" th:text="${total > 0 ? #numbers.formatDecimal(m * 100.0 / total, 1, 2) + '%' : '-'}">0%</span>
                <span class="hm-share-count" th:text="${isTime ? #numbers.formatInteger(m / 3600, 1, 'COMMA') + 'h' : #numbers.formatInteger(m, 1, 'COMMA')}">0</span>
            </span>
            <span class="hm-share is-female" title="Female">
                <span class="hm-share-pct" th:text="${total > 0 ? #numbers.formatDecimal(f * 100.0 / total, 1, 2) + '%' : '-'}">0%</span>
                <span class="hm-share-count" th:text="${isTime ? #numbers.formatInteger(f / 3600, 1, 'COMMA') + 'h' : #numbers.formatInteger(f, 1, 'COMMA')}">0</span>
            </span>
        </div>
    </th:block>
</body>
</html>
