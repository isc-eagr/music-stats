<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Import Result</title>
    <link rel="stylesheet" th:href="@{/css/global.css(v=3)}" />
    <th:block th:replace="~{fragments/navigation :: nav-styles}"></th:block>
    <th:block th:replace="~{fragments/unmatched-plays-modal :: modal-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/import-plays.css(v=1)}" />
</head>
<body>
    <th:block th:replace="~{fragments/navigation :: navigation}"></th:block>

    <main class="container ip-page ip-result-page">
        <div class="ip-head">
            <span class="ip-eyebrow">CSV import</span>
            <h1>Import Result</h1>
        </div>

        <section class="ip-card ip-result-card">
            <th:block th:if="${error}">
                <div class="ip-alert is-error" role="alert" th:text="${error}">Error</div>
                <div class="ip-actions"><a th:href="@{/plays/upload}" class="ip-btn ip-btn--primary">Back to Import Plays</a></div>
            </th:block>

            <th:block th:if="${stats}">
                <div class="ip-meta">
                    <span class="ip-pill" th:text="${'Account · ' + account}">Account · robertlover</span>
                    <span class="ip-pill" th:text="${'Batch size · ' + batchSize}">Batch size · 2000</span>
                    <span class="ip-pill is-warn" th:if="${dryRun}">Dry run · nothing was saved</span>
                </div>
                <div class="ip-result-headline">
                    <b th:text="${#numbers.formatInteger(stats.totalProcessed, 1, 'COMMA')}">0</b>
                    <span th:text="${dryRun ? 'plays read' : 'plays processed'}">plays processed</span>
                </div>
                <div class="ip-result-stats">
                    <span class="is-ok"><b th:text="${#numbers.formatInteger(stats.totalMatched, 1, 'COMMA')}">0</b> matched</span>
                    <span class="is-warn"><b id="unmatchedCount" th:text="${stats.totalUnmatched}">0</b> unmatched</span>
                    <span class="is-bad" th:if="${stats.totalErrors != null and stats.totalErrors > 0}"><b th:text="${stats.totalErrors}">0</b> errors</span>
                </div>

                <div th:if="${unmatchedList != null and !unmatchedList.isEmpty()}" class="ip-callout">
                    <div class="ip-callout-text">
                        <b><span th:text="${#lists.size(unmatchedList)}">0</span> song(s) didn't match</b>
                        <span>Create them or link them to songs you already have.</span>
                    </div>
                    <button type="button" class="ip-btn ip-btn--attention" onclick="showUnmatchedFromImport()">Fix unmatched plays</button>
                </div>

                <div class="ip-actions">
                    <a th:href="@{/plays/upload}" class="ip-btn ip-btn--primary">Back to Import Plays</a>
                    <a th:href="@{/}" class="ip-btn ip-btn--ghost">Home</a>
                </div>

                <p class="ip-note" th:if="${note}" th:text="${note}"></p>
            </th:block>
        </section>
    </main>

    <!-- Include modal fragments -->
    <th:block th:replace="~{fragments/unmatched-plays-modal :: unmatched-list-modal}"></th:block>
    <th:block th:replace="~{fragments/unmatched-plays-modal :: create-wizard-modal}"></th:block>
    <th:block th:replace="~{fragments/unmatched-plays-modal :: match-modal}"></th:block>
    <th:block th:replace="~{fragments/external-fetch-modal :: external-fetch-modal}"></th:block>
    <th:block th:replace="~{fragments/artist-fetch-modal :: artist-fetch-modal}"></th:block>

    <!-- Include modal scripts -->
    <th:block th:replace="~{fragments/unmatched-plays-modal :: modal-scripts}"></th:block>

    <script th:inline="javascript">
        // Pass unmatched list from server to JavaScript
        const unmatchedFromImport = /*[[${unmatchedList}]]*/ [];

        function showUnmatchedFromImport() {
            openUnmatchedListModal(unmatchedFromImport);
        }
    </script>
</body>
</html>
